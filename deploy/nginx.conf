# RBMS 线上 Nginx 片段
#
# 适用方式：Nginx 直接托管前端构建产物，并把 /api 反代到 Express。
# 使用前必须替换占位符（不替换的话 Nginx 会因路径非法而启动失败）：
#
#   __FRONTEND_ROOT__   构建产物 dist 的绝对路径，例如 /var/www/rbms/dist
#   __API_UPSTREAM__    Express 监听地址，例如 127.0.0.1:3000
#   __SERVER_NAME__     域名或服务器 IP，例如 120.27.130.34
#
# 依赖：
#   gzip_static 需要 ngx_http_gzip_static_module（常见发行版的 nginx 包已带上）。
#   确认：nginx -V 2>&1 | grep gzip_static
#   构建时 Vite 会在每个 js/css/html 旁生成同名 .gz（vite-plugin-compression）。
#   没有该模块时，删掉两处 gzip_static，仅保留 gzip on，由 Nginx 动态压缩。
#
# 若当前站点是「整站 proxy_pass 到 Express、由 Express 托管 dist」，
# 用下面这个 server 替换该反代，静态文件才能吃到 gzip_static 和缓存头。
# Express 仍只负责 /api，无需为了压缩去改 Node。

gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml
  text/html;

server {
  listen 80;
  server_name __SERVER_NAME__;

  root __FRONTEND_ROOT__;
  index index.html;

  # 带内容哈希的构建产物：可长期缓存。文件名一变即失效。
  location /assets/ {
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 入口 HTML 引用最新哈希，不能缓存。
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    proxy_pass http://__API_UPSTREAM__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 前端 history 路由：/login、/board、/book 都回到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
